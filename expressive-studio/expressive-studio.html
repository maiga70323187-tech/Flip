<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expressive Studio</title>
<style>
:root {
  --bg: #1d1d1d;
  --panel: #262626;
  --panel-2: #2f2f2f;
  --panel-3: #383838;
  --border: #3c3c3c;
  --text: #e9e9e9;
  --text-dim: #9b9b9b;
  --accent: #8f52f5;
  --accent-2: #c93dfc;
  --accent-text: #fff;
  --ok: #4ec98a;
  --warn: #e0a72c;
  --err: #ff6b6b;
  --kf: #ffc107;
  --row: 26px;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
:root[data-theme="light"] {
  --bg: #efefef; --panel: #fff; --panel-2: #f6f6f6; --panel-3: #ebebeb;
  --border: #d5d5d5; --text: #1d1d1d; --text-dim: #6c6c6c; --accent: #6e25f2;
  --kf: #b8860b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
  user-select: none;
}
#app {
  display: grid; height: 100vh;
  grid-template-areas: "top top top" "tools canvas side" "timeline timeline timeline";
  grid-template-columns: 50px minmax(0,1fr) 296px;
  grid-template-rows: 46px minmax(0,1fr) 232px;
}
.topbar {
  grid-area: top; background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; padding: 0 10px;
}
.brand { font-weight: 700; letter-spacing: .3px; margin-right: 6px; white-space: nowrap; }
.brand span { color: var(--accent-2); }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.spacer { flex: 1; }
button, select, input {
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px;
}
button { cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--panel-3); border-color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border); }
button.go { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
input[type=text], input[type=number] { width: 100%; }
input[type=color] { padding: 1px; height: 26px; width: 34px; cursor: pointer; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

.toolbar {
  grid-area: tools; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0;
}
.tool {
  width: 36px; height: 36px; display: grid; place-items: center; padding: 0;
  background: transparent; border-color: transparent; border-radius: 5px;
}
.tool svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

.canvas-area { grid-area: canvas; position: relative; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center;
  background: rgba(0,0,0,.45); border-radius: 5px; padding: 4px 8px;
  font-family: var(--mono); font-size: 11px; color: #fff; pointer-events: none;
}
.canvas-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 5px; }

.side {
  grid-area: side; background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button {
  flex: 1; border: none; border-radius: 0; background: var(--panel-2); padding: 7px 4px;
  color: var(--text-dim); font-size: 12px; border-bottom: 2px solid transparent;
}
.tabs button.on { background: var(--panel); color: var(--text); border-bottom-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; overflow-x: hidden; }
.pane[hidden] { display: none; }
.group { border-bottom: 1px solid var(--border); padding: 9px 10px; }
.group > h3 {
  margin: 0 0 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--text-dim); font-weight: 600;
}
.field { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.field > label { flex: 0 0 58px; color: var(--text-dim); font-size: 12px; }
.field .pair { display: flex; gap: 5px; flex: 1; min-width: 0; }
.field .pair input { min-width: 0; }
.kfbtn {
  flex: 0 0 22px; width: 22px; height: 22px; padding: 0; display: grid; place-items: center;
  background: transparent; border-color: transparent; border-radius: 3px;
}
.kfbtn:hover { background: var(--panel-3); }
.kfbtn i {
  display: block; width: 8px; height: 8px; transform: rotate(45deg);
  border: 1.4px solid var(--text-dim); border-radius: 1px;
}
.kfbtn.on i { background: var(--kf); border-color: var(--kf); }
.hint { color: var(--text-dim); font-size: 11.5px; padding: 14px 10px; text-align: center; }

.layers { padding: 4px 0; }
.layer {
  display: flex; align-items: center; gap: 5px; padding: 3px 8px; cursor: default;
  border-left: 2px solid transparent; font-size: 12.5px;
}
.layer:hover { background: var(--panel-2); }
.layer.sel { background: var(--panel-3); border-left-color: var(--accent); }
.layer .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .ic { width: 15px; text-align: center; color: var(--text-dim); font-size: 11px; flex: none; }
.layer button {
  background: transparent; border: none; padding: 0 2px; color: var(--text-dim);
  font-size: 11px; line-height: 1; border-radius: 3px;
}
.layer button:hover { color: var(--text); background: var(--panel-3); }
.layer .nm input { width: 100%; padding: 1px 3px; font-size: 12.5px; }

.timeline {
  grid-area: timeline; background: var(--panel); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.tl-bar { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--border); }
.tl-time { font-family: var(--mono); font-size: 12px; color: var(--text-dim); min-width: 132px; }
.rec.on { background: #d33; border-color: #d33; color: #fff; }
.tl-body { flex: 1; display: grid; grid-template-columns: 210px minmax(0,1fr); overflow: hidden; }
.tl-names { border-right: 1px solid var(--border); overflow: hidden auto; background: var(--panel-2); }
.tl-tracks { position: relative; overflow: auto; }
.tl-ruler {
  position: sticky; top: 0; height: 22px; background: var(--panel-2);
  border-bottom: 1px solid var(--border); z-index: 3;
}
.tl-ruler canvas { display: block; height: 22px; }
.tl-names .head { height: 22px; border-bottom: 1px solid var(--border); background: var(--panel-2); position: sticky; top: 0; z-index: 3; }
.tl-row { height: var(--row); display: flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 12px; white-space: nowrap; }
.tl-row.el { font-weight: 600; background: var(--panel-3); }
.tl-row.el.sel { color: var(--accent-2); }
.tl-row.prop { color: var(--text-dim); padding-left: 22px; }
.track { height: var(--row); position: relative; }
.track.el { background: rgba(255,255,255,.035); }
.kfd {
  position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
  background: var(--kf); border: 1px solid #0006; transform: rotate(45deg); cursor: grab; border-radius: 1px;
}
.kfd.sel { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.kfseg { position: absolute; top: 50%; height: 3px; margin-top: -1.5px; background: var(--kf); opacity: .3; }
#playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #ff4d4d; z-index: 4; pointer-events: none; }
#playhead::before {
  content: ''; position: absolute; top: 0; left: -5px; border: 5px solid transparent;
  border-top-color: #ff4d4d; border-bottom: none; height: 0;
}
.modal-bg {
  position: fixed; inset: 0; background: #0009; display: grid; place-items: center; z-index: 50;
}
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; width: min(430px, 92vw); max-height: 86vh; overflow: auto;
}
.modal h2 { margin: 0 0 12px; font-size: 15px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
#toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--panel-3); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 14px; z-index: 60; opacity: 0; transition: opacity .25s; pointer-events: none;
  max-width: 80vw;
}
#toast.show { opacity: 1; }
#toast.err { border-color: var(--err); color: var(--err); }
#toast.ok { border-color: var(--ok); }
progress { width: 100%; height: 5px; }
@media (max-width: 880px) {
  #app { grid-template-columns: 46px minmax(0,1fr) 240px; grid-template-rows: 46px minmax(0,1fr) 200px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Expressive <span>Studio</span></div>
    <div class="sep"></div>
    <button id="m-new" class="ghost" title="Nouveau document">Nouveau</button>
    <button id="m-open" class="ghost" title="Ouvrir un .eaf">Ouvrir</button>
    <button id="m-save" class="ghost" title="Enregistrer en .eaf (Ctrl+S)">Enregistrer</button>
    <div class="sep"></div>
    <button id="m-undo" class="ghost" title="Annuler (Ctrl+Z)">&#8630;</button>
    <button id="m-redo" class="ghost" title="Rétablir (Ctrl+Y)">&#8631;</button>
    <div class="sep"></div>
    <button id="m-group" class="ghost" title="Grouper (Ctrl+G)">Grouper</button>
    <button id="m-ungroup" class="ghost" title="Dégrouper (Ctrl+Maj+G)">Dégrouper</button>
    <button id="m-dup" class="ghost" title="Dupliquer (Ctrl+D)">Dupliquer</button>
    <button id="m-del" class="ghost" title="Supprimer (Suppr)">Supprimer</button>
    <div class="spacer"></div>
    <button id="m-demo" class="ghost" title="Charger une animation d'exemple">Exemple</button>
    <button id="m-theme" class="ghost" title="Thème clair / sombre">&#9681;</button>
    <button id="m-export" class="go" title="Exporter en MP4 ou PNG">Exporter</button>
    <input type="file" id="file-input" accept=".eaf" hidden>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div class="canvas-area">
    <canvas id="stage"></canvas>
    <div class="canvas-tools">
      <button id="v-fit" class="ghost" title="Ajuster à la fenêtre (Maj+0)">Ajuster</button>
      <button id="v-100" class="ghost" title="Zoom 100 % (Ctrl+0)">100 %</button>
      <button id="v-grid" class="ghost" title="Grille et magnétisme">Grille</button>
    </div>
    <div class="hud"><span id="hud-zoom">100 %</span><span id="hud-pos">0, 0</span></div>
  </div>

  <div class="side">
    <div class="tabs">
      <button id="tab-props" class="on">Propriétés</button>
      <button id="tab-layers">Calques</button>
    </div>
    <div class="pane" id="pane-props"></div>
    <div class="pane" id="pane-layers" hidden>
      <div class="layers" id="layer-list"></div>
    </div>
  </div>

  <div class="timeline">
    <div class="tl-bar">
      <button id="t-rec" class="rec" title="Mode enregistrement : toute modification pose une clé">&#9679; Enreg.</button>
      <div class="sep"></div>
      <button id="t-start" class="ghost" title="Début">&#124;&#9664;</button>
      <button id="t-play" class="ghost" title="Lire / Pause (Espace)">&#9654;</button>
      <button id="t-end" class="ghost" title="Fin">&#9654;&#124;</button>
      <button id="t-loop" class="ghost" title="Lecture en boucle">&#8635;</button>
      <div class="tl-time" id="t-time">0:00.000 / 0:05.000</div>
      <div class="sep"></div>
      <button id="t-addkf" class="ghost" title="Poser une clé sur toutes les propriétés animées">Poser une clé</button>
      <button id="t-delkf" class="ghost" title="Supprimer les clés sélectionnées (Suppr)">Supprimer clé</button>
      <label style="color:var(--text-dim);font-size:12px">Accélération</label>
      <select id="t-easing" style="width:130px">
        <option value="linear">Linéaire</option>
        <option value="ease">Douce</option>
        <option value="ease-in">Entrée douce</option>
        <option value="ease-out">Sortie douce</option>
        <option value="ease-in-out">Entrée et sortie</option>
      </select>
      <div class="spacer"></div>
      <label style="color:var(--text-dim);font-size:12px">Zoom</label>
      <input type="range" id="t-zoom" min="20" max="600" value="100" style="width:110px;padding:0">
    </div>
    <div class="tl-body">
      <div class="tl-names" id="tl-names"><div class="head"></div></div>
      <div class="tl-tracks" id="tl-tracks">
        <div class="tl-ruler"><canvas id="tl-ruler-canvas" height="22"></canvas></div>
        <div id="tl-rows" style="position:relative"></div>
        <div id="playhead"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>

const EASINGS = {

  'ease-in': [0.42, 0, 1, 1],

function cubicBezierEase(c, t) {

    if (Math.abs(d) < 1e-6) break;
    u -= x / d;

  u = t;
  for (let i = 0; i < 24; i++) {
    const x = sampleX(u);
    if (Math.abs(x - t) < 1e-6) break;

class Keyframe {

  }
  clone() { return new Keyframe(cloneValue(this.value), this.offset, this.easing); }
}

  get isAnimated() { return !this.disabled && this.keyframes.length > 1; }

    const t = tolerance == null ? 0.5 : tolerance;
    return this.keyframes.find(k => Math.abs(k.offset - offset) <= t) || null;

    const existing = this.keyframeAt(offset);
    if (existing) {

      if (easing !== undefined) existing.easing = easing;
      return existing;
    }

    this.keyframes.push(k);

    const kf = this.keyframes, last = kf.length - 1;
    if (last < 0) return null;
    if (last === 0) return kf[0].value;
    if (offset <= kf[0].offset) return kf[0].value;
    if (offset >= kf[last].offset) return kf[last].value;
    let lo = 0, hi = last;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (kf[mid].offset <= offset) lo = mid; else hi = mid;

      const r = s.radius || 0;
      return { x: -r, y: -r, w: 2 * r, h: 2 * r };

    case 'star': {
      const r = Math.max(s.outerRadius || 0, s.innerRadius || 0);
      return { x: -r, y: -r, w: 2 * r, h: 2 * r };

    const pts = s.points || [];
    if (!pts.length) return;
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    if (s.isClosed !== false) ctx.closePath();
    return;
  }
  if (type === 'path') {
    const nodes = s.path || [];
    if (!nodes.length) return;
    const handle = (node, h) => (h ? { x: node.x + (h.x || 0), y: node.y + (h.y || 0) } : { x: node.x, y: node.y });
    ctx.moveTo(nodes[0].x, nodes[0].y);
    for (let i = 1; i < nodes.length; i++) {
      const a = nodes[i - 1], b = nodes[i];
      const c1 = handle(a, a.handleOut), c2 = handle(b, b.handleIn);
      ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, b.x, b.y);
    }
    const first = nodes[0], last = nodes[nodes.length - 1];
    const c1 = handle(last, last.handleOut), c2 = handle(first, first.handleIn);
    ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, first.x, first.y);
    ctx.closePath();
  }
}

function paintCurrent(ctx, s) {
  const fill = makePaint(ctx, s.fill, s.fillOpacity == null ? 1 : s.fillOpacity);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill(s.fillRule === 'evenodd' ? 'evenodd' : 'nonzero');
  }
  const w = s.strokeLineWidth || 0;
  if (w > 0) {
    const stroke = makePaint(ctx, s.strokeBrush, s.strokeOpacity == null ? 1 : s.strokeOpacity);
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = w;
      ctx.lineCap = s.lineCap || 'butt';
      ctx.lineJoin = s.lineJoin || 'miter';
      ctx.miterLimit = s.miterLimit || 4;
      if (s.strokeDashArray && s.strokeDashArray.length) {
        ctx.setLineDash(s.strokeDashArray);
        ctx.lineDashOffset = s.strokeDashOffset || 0;
      } else ctx.setLineDash([]);
      ctx.stroke();
    }
  }
}

function drawElement(ctx, element, time) {
  if (element.hidden) return;
  const s = stateAt(element, time);
  const opacity = clamp(s.opacity == null ? 1 : s.opacity, 0, 1);
  if (opacity <= 0) return;

  ctx.save();
  ctx.globalAlpha *= opacity;
  applyTransform(ctx, s);

  if (element.type === 'text') {
    ctx.font = fontString(s);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = s.align || 'left';
    const fill = makePaint(ctx, s.fill, s.fillOpacity == null ? 1 : s.fillOpacity);
    if (fill) { ctx.fillStyle = fill; ctx.fillText(s.text || '', 0, 0); }
    if ((s.strokeLineWidth || 0) > 0) {
      const stroke = makePaint(ctx, s.strokeBrush, s.strokeOpacity == null ? 1 : s.strokeOpacity);
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = s.strokeLineWidth; ctx.strokeText(s.text || '', 0, 0); }
    }
  } else if (element.type === 'clip-path') {
    traceShape(ctx, 'path', s);
    ctx.clip();
  } else if (element.type !== 'group' && element.type !== 'mask' && element.type !== 'symbol') {
    traceShape(ctx, element.type, s);
    paintCurrent(ctx, s);
  }

  for (const child of element.children || []) drawElement(ctx, child, time);
  ctx.restore();
}

/* Rendu du document seul, utilisé aussi par l'export. */
function renderDocument(ctx, doc, time, options) {
  options = options || {};
  const scale = options.scale || 1;
  const w = Math.round(doc.width * scale), h = Math.round(doc.height * scale);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const bg = options.background === undefined ? doc.background : options.background;
  if (bg && bg !== 'transparent') { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
  ctx.save();
  ctx.scale(scale, scale);
  ctx.globalAlpha = 1;
  for (const el of doc.children) drawElement(ctx, el, time);
  ctx.restore();
}

/* ===================== format .eaf : écriture et lecture =================
   Conteneur identique à NativeAnimationExporter.ts :
     [magic 0x65377865 "ex7e"][0x01][uint32 taille][manifeste gzip]
     [0x03][uint32 taille][document gzip] …  [0xef]
   Chaque bloc est du JSON compressé en gzip.
   ======================================================================== */
const ANIM_TYPE_BY_KIND = {
  point: 'point', brush: 'brush', 'point-array': 'point-array',
  'rect-shape-radius': 'rect-shape-radius', path: 'path', 'path-node': 'path-node'
};

function serBrush(b) {
  if (!b) return null;
  if (b.kind === 'solid') return { type: 0, color: colorToCode(b.color) };
  const stops = (b.stops || []).map(s => ({ color: colorToCode(s.color), offset: s.offset }));
  if (b.kind === 'linear') return { type: 1, spread: 0, stopColors: stops, transform: null, start: b.start, end: b.end };
  if (b.kind === 'radial') return { type: 2, spread: 0, stopColors: stops, transform: null, center: b.center, radius: b.radius };
  if (b.kind === 'conical') return { type: 3, spread: 0, stopColors: stops, transform: null, center: b.center, startAngle: b.startAngle, endAngle: b.endAngle };
  return null;
}

function desBrush(d) {
  if (!d) return null;
  if (d.color !== undefined) return { kind: 'solid', color: parseColor(d.color) };
  const stops = (d.stopColors || []).map(s => ({ offset: s.offset, color: parseColor(s.color) }));
  if (d.start && d.end) return { kind: 'linear', start: d.start, end: d.end, stops: stops };
  if (d.center && d.radius !== undefined) return { kind: 'radial', center: d.center, radius: d.radius, stops: stops };
  if (d.center && d.startAngle !== undefined) return { kind: 'conical', center: d.center, startAngle: d.startAngle, endAngle: d.endAngle, stops: stops };
  return null;
}

const CAPS = ['butt', 'round', 'square'];
const JOINS = ['miter', 'round', 'bevel'];

function serElement(el) {
  const p = el.props;
  const data = {
    id: el.id, title: el.title, type: el.type, locked: !!el.locked, hidden: !!el.hidden,
    properties: {
      element: {
        anchor: p.anchor, scale: p.scale, position: p.position,
        rotate: p.rotate, skewAngle: p.skewAngle, skewAxis: p.skewAxis,
        orientation: 0, opacity: p.opacity, blend: 0, isolate: false
      }
    }
  };
  if (el.type !== 'group') {
    data.properties.vector = {
      stroke: {
        brush: serBrush(p.strokeBrush), width: p.strokeLineWidth,
        lineCap: Math.max(0, CAPS.indexOf(p.lineCap)), lineJoin: Math.max(0, JOINS.indexOf(p.lineJoin)),
        miterLimit: p.miterLimit, dashes: p.strokeDashArray, offset: p.strokeDashOffset
      },
      fill: serBrush(p.fill), fillOpacity: p.fillOpacity, strokeOpacity: p.strokeOpacity,
      paintOrder: 0, fillRule: p.fillRule === 'evenodd' ? 1 : 0
    };
  }
  switch (el.type) {
    case 'rect': data.properties.rect = { width: p.width, height: p.height, radius: p.radius }; break;
    case 'ellipse': data.properties.ellipse = { width: p.width, height: p.height }; break;
    case 'regular-polygon': data.properties.regularPolygon = { sides: p.sides, radius: p.radius, cornerRadius: p.cornerRadius, angle: p.angle }; break;
    case 'star': data.properties.star = {
      sides: p.sides, outerRotate: p.outerRotate, outerRadius: p.outerRadius, outerCornerRadius: 0,
      innerRotate: p.innerRotate, innerRadius: p.innerRadius, innerCornerRadius: 0, angle: p.angle
    }; break;
    case 'poly': data.properties.poly = { points: p.points, isClosed: p.isClosed }; break;
    case 'path': data.properties.path = { path: p.path }; break;
    case 'text': data.properties.text = {
      text: p.text,
      font: { family: p.fontFamily, style: p.fontStyle, weight: p.fontWeight, size: p.fontSize },
      align: p.align
    }; break;
    case 'group': data.properties.group = {}; break;
  }
  if (el.children && el.children.length) data.children = el.children.map(serElement);
  return data;
}

function desElement(data) {
  const p = data.properties || {};
  const e = p.element || {}, v = p.vector || {}, pen = v.stroke || {};
  const props = Object.assign(DEFAULT_PROPS(), {
    position: e.position || { x: 0, y: 0 },
    anchor: e.anchor || { x: 0, y: 0 },
    scale: e.scale || { x: 1, y: 1 },
    rotate: e.rotate || 0,
    skewAngle: e.skewAngle || 0,
    skewAxis: e.skewAxis || 0,
    opacity: e.opacity == null ? 1 : e.opacity,
    fill: desBrush(v.fill),
    fillOpacity: v.fillOpacity == null ? 1 : v.fillOpacity,
    strokeBrush: desBrush(pen.brush),
    strokeOpacity: v.strokeOpacity == null ? 1 : v.strokeOpacity,
    strokeLineWidth: pen.width || 0,
    strokeDashArray: pen.dashes || null,
    strokeDashOffset: pen.offset || 0,
    lineCap: CAPS[pen.lineCap | 0] || 'butt',
    lineJoin: JOINS[pen.lineJoin | 0] || 'miter',
    miterLimit: pen.miterLimit || 4,
    fillRule: v.fillRule === 1 ? 'evenodd' : 'nonzero'
  });
  if (p.rect) Object.assign(props, { width: p.rect.width, height: p.rect.height, radius: p.rect.radius || { rx: 0, ry: 0, multiple: true } });
  if (p.ellipse) Object.assign(props, { width: p.ellipse.width, height: p.ellipse.height });
  if (p.regularPolygon) Object.assign(props, p.regularPolygon);
  if (p.star) Object.assign(props, p.star);
  if (p.poly) Object.assign(props, { points: p.poly.points, isClosed: p.poly.isClosed });
  if (p.path) props.path = p.path.path;
  if (p.clipPath) props.path = p.clipPath.path;
  if (p.text) {
    const f = p.text.font || {};
    Object.assign(props, {
      text: p.text.text, fontFamily: f.family || 'Arial, Helvetica, sans-serif',
      fontStyle: f.style || 'normal', fontWeight: f.weight || 400, fontSize: f.size || 48,
      align: p.text.align || 'left'
    });
  }
  const el = {
    id: data.id || uid('el'), type: data.type, title: data.title || TYPE_LABEL[data.type] || data.type,
    hidden: !!data.hidden, locked: !!data.locked, props: props, animations: {},
    children: (data.children || []).map(desElement), parent: null
  };
  return el;
}

function serAnimations(doc) {
  const out = {};
  for (const el of walk(doc.children)) {
    const keys = Object.keys(el.animations);
    if (!keys.length) continue;
    const entry = {};
    for (const property of keys) {
      const animation = el.animations[property];
      if (!animation.hasKeyframes) continue;
      const spec = PROPERTY_SPEC[property] || {};
      const kind = ANIM_TYPE_BY_KIND[spec.kind] || 'generic';
      const enc = kind === 'brush' ? serBrush : (x) => x;
      entry[property] = {
        type: kind, disabled: !!animation.disabled,
        keyframes: animation.keyframes.map(k => ({
          easing: typeof k.easing === 'string' ? k.easing : null,
          offset: k.offset, value: enc(k.value)
        }))
      };
    }
    if (Object.keys(entry).length) out[el.id] = entry;
  }
  return out;
}

function desAnimations(doc, data) {
  const index = new Map();
  for (const el of walk(doc.children)) index.set(el.id, el);
  for (const elementId in data) {
    const el = index.get(elementId);
    if (!el) continue;
    for (const property in data[elementId]) {
      const a = data[elementId][property];
      const dec = a.type === 'brush' ? desBrush : (x) => x;
      const keyframes = (a.keyframes || []).map(k => new Keyframe(dec(k.value), k.offset, k.easing || null));
      el.animations[property] = new Animation(property, keyframes, a.disabled);
    }
  }
}

function serializeDocument(doc) {
  return {
    id: doc.id, title: doc.title,
    guides: { guides: [] }, grid: null,
    properties: {
      size: { width: doc.width, height: doc.height },
      /* extension propre à cet éditeur ; ignorée par l'importeur d'origine */
      studio: { fps: doc.fps, background: doc.background }
    },
    animation: { startTime: doc.startTime, endTime: doc.endTime, mode: 0, animations: serAnimations(doc) },
    children: doc.children.map(serElement)
  };
}

function deserializeDocument(data) {
  const a = data.animation || {};
  const size = (data.properties && data.properties.size) || { width: 1280, height: 720 };
  const studio = (data.properties && data.properties.studio) || {};
  const doc = {
    id: data.id || uid('doc'), title: data.title || 'Document',
    width: size.width, height: size.height,
    startTime: a.startTime || 0, endTime: a.endTime || 5000,
    fps: studio.fps || 25, background: studio.background || '#ffffff',
    children: (data.children || []).map(desElement)
  };
  relink(doc.children, null);
  desAnimations(doc, a.animations || {});
  return doc;
}

async function gzip(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function gunzip(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

async function writeEaf(doc) {
  const manifest = await gzip(JSON.stringify({
    type: 'expressive/animation', version: 100, documents: [doc.id], masterDocument: doc.id
  }));
  const body = await gzip(JSON.stringify(serializeDocument(doc)));

  const head = new DataView(new ArrayBuffer(9));
  head.setUint32(0, 0x65377865);
  head.setUint8(4, 0x01);
  head.setUint32(5, manifest.length);

  const docHead = new DataView(new ArrayBuffer(5));
  docHead.setUint8(0, 0x03);
  docHead.setUint32(1, body.length);

  return new Blob([head.buffer, manifest, docHead.buffer, body, new Uint8Array([0xef])],
    { type: 'application/octet-stream' });
}

async function readEaf(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  let offset = 0;
  const need = (n) => { if (offset + n > bytes.length) throw new Error('Fichier .eaf tronqué ou invalide.'); };

  need(4);
  if (view.getUint32(offset) !== 0x65377865) throw new Error("Ce fichier n'est pas un projet Expressive (.eaf).");
  offset += 4;
  need(1);
  if (view.getUint8(offset) !== 0x01) throw new Error('Manifeste absent.');
  offset += 1;
  need(4);
  const mlen = view.getUint32(offset); offset += 4;
  need(mlen);
  const manifest = JSON.parse(await gunzip(bytes.subarray(offset, offset + mlen)));
  offset += mlen;
  if (manifest.type !== 'expressive/animation') throw new Error('Type de projet inattendu : ' + manifest.type);

  const documents = [];
  while (offset < bytes.length) {
    const t = view.getUint8(offset);
    if (t === 0xef) break;
    if (t === 0x03) {
      offset += 1;
      need(4);
      const len = view.getUint32(offset); offset += 4;
      need(len);
      documents.push(JSON.parse(await gunzip(bytes.subarray(offset, offset + len))));
      offset += len;
      continue;
    }
    offset += 1;
  }
  if (!documents.length) throw new Error('Aucun document dans le fichier.');
  const master = documents.find(d => d.id === manifest.masterDocument) || documents[0];
  return deserializeDocument(master);
}

/* Instantané pour l'historique (annuler / rétablir). */
const snapshot = (doc) => JSON.stringify(serializeDocument(doc));
const restore = (json) => deserializeDocument(JSON.parse(json));

/* ============================ archive ZIP (stockée) ====================== */
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(b) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const L = new DataView(new ArrayBuffer(30));
    L.setUint32(0, 0x04034b50, true); L.setUint16(4, 20, true); L.setUint16(8, 0, true);
    L.setUint32(14, crc, true); L.setUint32(18, data.length, true); L.setUint32(22, data.length, true);
    L.setUint16(26, name.length, true);
    chunks.push(L.buffer, name, data);
    const C = new DataView(new ArrayBuffer(46));
    C.setUint32(0, 0x02014b50, true); C.setUint16(4, 20, true); C.setUint16(6, 20, true);
    C.setUint32(16, crc, true); C.setUint32(20, data.length, true); C.setUint32(24, data.length, true);
    C.setUint16(28, name.length, true); C.setUint32(42, offset, true);
    central.push({ h: C.buffer, n: name });
    offset += 30 + name.length + data.length;
  }
  const start = offset;
  let size = 0;
  for (const c of central) { chunks.push(c.h, c.n); size += 46 + c.n.length; }
  const E = new DataView(new ArrayBuffer(22));
  E.setUint32(0, 0x06054b50, true); E.setUint16(8, files.length, true); E.setUint16(10, files.length, true);
  E.setUint32(12, size, true); E.setUint32(16, start, true);
  chunks.push(E.buffer);
  return new Blob(chunks, { type: 'application/zip' });
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ============================== état de l'application =================== */
const app = {
  doc: createDocument(),
  time: 0,
  selection: [],            // identifiants d'éléments
  selectedKeyframes: [],    // { elementId, property, keyframeId }
  tool: 'select',
  view: { zoom: 1, x: 0, y: 0 },
  recording: false,
  playing: false,
  loop: false,
  grid: false,
  gridSize: 20,
  snap: true,
  past: [],
  future: [],
  fileName: null,
  timelineZoom: 100      // pixels par seconde
};

const stage = $('stage');
const sctx = stage.getContext('2d');
let needsRender = true;
const invalidate = () => { needsRender = true; };

const selectedElements = () => app.selection.map(id => findById(app.doc, id)).filter(Boolean);
const firstSelected = () => selectedElements()[0] || null;

/* --------------------------------------------------------- historique --- */
function pushHistory() {
  app.past.push(snapshot(app.doc));
  if (app.past.length > 60) app.past.shift();
  app.future.length = 0;
  updateHistoryButtons();
}
function applyState(json) {
  app.doc = restore(json);
  hoverElement = null;
  app.selection = app.selection.filter(id => findById(app.doc, id));
  app.selectedKeyframes = [];
  refreshAll();
}
function undo() {
  if (!app.past.length) return;
  app.future.push(snapshot(app.doc));
  applyState(app.past.pop());
  updateHistoryButtons();
}
function redo() {
  if (!app.future.length) return;
  app.past.push(snapshot(app.doc));
  applyState(app.future.pop());
  updateHistoryButtons();
}
function updateHistoryButtons() {
  $('m-undo').disabled = !app.past.length;
  $('m-redo').disabled = !app.future.length;
}

/* ------------------------------------------------ vue et coordonnées ---- */
function resizeStage() {
  const rect = stage.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  stage.width = Math.max(1, Math.round(rect.width * dpr));
  stage.height = Math.max(1, Math.round(rect.height * dpr));
  stage.style.width = rect.width + 'px';
  stage.style.height = rect.height + 'px';
  stage._dpr = dpr;
  stage._w = rect.width;
  stage._h = rect.height;
  invalidate();
}

function screenToScene(sx, sy) {
  return { x: (sx - app.view.x) / app.view.zoom, y: (sy - app.view.y) / app.view.zoom };
}
function sceneToScreen(x, y) {
  return { x: x * app.view.zoom + app.view.x, y: y * app.view.zoom + app.view.y };
}
function pointerScene(e) {
  const r = stage.getBoundingClientRect();
  return screenToScene(e.clientX - r.left, e.clientY - r.top);
}
function zoomTo(zoom, centerX, centerY) {
  const z = clamp(zoom, 0.02, 32);
  const cx = centerX == null ? stage._w / 2 : centerX;
  const cy = centerY == null ? stage._h / 2 : centerY;
  const before = screenToScene(cx, cy);
  app.view.zoom = z;
  app.view.x = cx - before.x * z;
  app.view.y = cy - before.y * z;
  $('hud-zoom').textContent = Math.round(z * 100) + ' %';
  invalidate();
}
function fitView() {
  const pad = 40;
  const z = Math.min((stage._w - pad * 2) / app.doc.width, (stage._h - pad * 2) / app.doc.height);
  app.view.zoom = clamp(z, 0.02, 32);
  app.view.x = (stage._w - app.doc.width * app.view.zoom) / 2;
  app.view.y = (stage._h - app.doc.height * app.view.zoom) / 2;
  $('hud-zoom').textContent = Math.round(app.view.zoom * 100) + ' %';
  invalidate();
}

/* ------------------------------------------ écriture d'une propriété ----
   Reprend la logique de AnimationMiddleware.setElementProperty :
   si la propriété est animée, ou si le mode enregistrement est actif,
   la valeur est posée sur une clé au temps courant.                       */
function setProperty(element, property, value) {
  const animation = element.animations[property];
  if (animation && !animation.disabled) {
    animation.setValueAt(app.time, value);
    element.props[property] = value;
    return;
  }
  if (app.recording && PROPERTY_SPEC[property]) {
    const created = new Animation(property, []);
    if (app.time !== app.doc.startTime) {
      created.setValueAt(app.doc.startTime, cloneValue(element.props[property]));
    }
    created.setValueAt(app.time, value);
    element.animations[property] = created;
    element.props[property] = value;
    return;
  }
  element.props[property] = value;
}

/* Bascule d'animation sur une propriété (le « chronomètre » des panneaux). */
function toggleAnimated(element, property) {
  if (element.animations[property]) {
    delete element.animations[property];
  } else {
    const a = new Animation(property, []);
    a.setValueAt(app.time, cloneValue(element.props[property]));
    element.animations[property] = a;
  }
}

function addKeyframesAtCurrentTime() {
  const els = selectedElements();
  const targets = els.length ? els : Array.from(walk(app.doc.children));
  let count = 0;
  for (const el of targets) {
    for (const property in el.animations) {
      const a = el.animations[property];
      const value = a.hasKeyframes ? cloneValue(a.getValueAtOffset(app.time)) : cloneValue(el.props[property]);
      a.setValueAt(app.time, value);
      count++;
    }
  }
  return count;
}

/* ------------------------------------------------------- sélection ------ */
function select(ids, additive) {
  const list = Array.isArray(ids) ? ids : (ids ? [ids] : []);
  if (additive) {
    for (const id of list) {
      const i = app.selection.indexOf(id);
      if (i === -1) app.selection.push(id); else app.selection.splice(i, 1);
    }
  } else {
    app.selection = list.slice();
  }
  refreshPanels();
  invalidate();
}

/* ============================ dessin de la scène ======================== */
const HANDLE_SIZE = 7;

function handlePositions(element) {
  const c = boxCorners(element, app.time).map(p => sceneToScreen(p.x, p.y));
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  return [
    { id: 'nw', p: c[0] }, { id: 'n', p: mid(c[0], c[1]) }, { id: 'ne', p: c[1] },
    { id: 'e', p: mid(c[1], c[2]) }, { id: 'se', p: c[2] }, { id: 's', p: mid(c[2], c[3]) },
    { id: 'sw', p: c[3] }, { id: 'w', p: mid(c[3], c[0]) },
    { id: 'rot', p: (function () {
        const m = mid(c[0], c[1]);
        const dx = m.x - (c[2].x + c[3].x) / 2, dy = m.y - (c[2].y + c[3].y) / 2;
        const len = Math.hypot(dx, dy) || 1;
        return { x: m.x + (dx / len) * 26, y: m.y + (dy / len) * 26 };
      })() }
  ];
}

function handleAt(screenPoint) {
  const els = selectedElements();
  if (els.length !== 1) return null;
  for (const h of handlePositions(els[0])) {
    if (Math.abs(screenPoint.x - h.p.x) <= HANDLE_SIZE && Math.abs(screenPoint.y - h.p.y) <= HANDLE_SIZE) return h.id;
  }
  return null;
}

let hoverElement = null;
let marquee = null;

function drawStage() {
  const dpr = stage._dpr || 1;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, stage._w, stage._h);

  const css = getComputedStyle(document.documentElement);
  sctx.fillStyle = css.getPropertyValue('--bg').trim() || '#1d1d1d';
  sctx.fillRect(0, 0, stage._w, stage._h);

  const z = app.view.zoom;
  sctx.save();
  sctx.translate(app.view.x, app.view.y);
  sctx.scale(z, z);

  // plan de travail
  sctx.save();
  sctx.shadowColor = 'rgba(0,0,0,.45)';
  sctx.shadowBlur = 18 / z;
  sctx.fillStyle = app.doc.background && app.doc.background !== 'transparent' ? app.doc.background : '#ffffff';
  sctx.fillRect(0, 0, app.doc.width, app.doc.height);
  sctx.restore();

  sctx.save();
  sctx.beginPath();
  sctx.rect(0, 0, app.doc.width, app.doc.height);
  sctx.clip();

  if (app.grid) {
    sctx.strokeStyle = 'rgba(128,128,128,.25)';
    sctx.lineWidth = 1 / z;
    sctx.beginPath();
    for (let x = 0; x <= app.doc.width; x += app.gridSize) { sctx.moveTo(x, 0); sctx.lineTo(x, app.doc.height); }
    for (let y = 0; y <= app.doc.height; y += app.gridSize) { sctx.moveTo(0, y); sctx.lineTo(app.doc.width, y); }
    sctx.stroke();
  }

  sctx.globalAlpha = 1;
  for (const el of app.doc.children) drawElement(sctx, el, app.time);
  sctx.restore();

  // contour du plan de travail
  sctx.strokeStyle = 'rgba(128,128,128,.55)';
  sctx.lineWidth = 1 / z;
  sctx.strokeRect(0, 0, app.doc.width, app.doc.height);
  sctx.restore();

  drawOverlays();
}

function drawOverlays() {
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#8f52f5';

  if (hoverElement && app.selection.indexOf(hoverElement.id) === -1) {
    const pts = boxCorners(hoverElement, app.time).map(p => sceneToScreen(p.x, p.y));
    sctx.strokeStyle = accent;
    sctx.lineWidth = 1;
    sctx.setLineDash([]);
    sctx.beginPath();
    pts.forEach((p, i) => i ? sctx.lineTo(p.x, p.y) : sctx.moveTo(p.x, p.y));
    sctx.closePath();
    sctx.stroke();
  }

  const els = selectedElements();
  for (const el of els) {
    const pts = boxCorners(el, app.time).map(p => sceneToScreen(p.x, p.y));
    sctx.strokeStyle = accent;
    sctx.lineWidth = 1.5;
    sctx.setLineDash([]);
    sctx.beginPath();
    pts.forEach((p, i) => i ? sctx.lineTo(p.x, p.y) : sctx.moveTo(p.x, p.y));
    sctx.closePath();
    sctx.stroke();
  }

  if (els.length === 1) {
    const handles = handlePositions(els[0]);
    for (const h of handles) {
      sctx.beginPath();
      if (h.id === 'rot') {
        sctx.arc(h.p.x, h.p.y, HANDLE_SIZE - 1, 0, Math.PI * 2);
      } else {
        sctx.rect(h.p.x - HANDLE_SIZE / 2, h.p.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
      }
      sctx.fillStyle = '#fff';
      sctx.strokeStyle = accent;
      sctx.lineWidth = 1.5;
      sctx.fill();
      sctx.stroke();
    }
  }

  if (marquee) {
    sctx.strokeStyle = accent;
    sctx.fillStyle = accent + '22';
    sctx.lineWidth = 1;
    sctx.setLineDash([4, 3]);
    const a = sceneToScreen(marquee.x, marquee.y);
    const b = sceneToScreen(marquee.x + marquee.w, marquee.y + marquee.h);
    sctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
    sctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
    sctx.setLineDash([]);
  }
}

function renderLoop() {
  if (needsRender) { needsRender = false; drawStage(); }
  requestAnimationFrame(renderLoop);
}

/* ================================ outils ================================ */
const TOOLS = [
  { id: 'select', key: 'V', label: 'Sélection (V)', icon: 'M5 3l13 8-5.5 1.3L15 18l-2.2 1-2.6-5.6L6 17z' },
  { id: 'pan', key: 'H', label: 'Main (H)', icon: 'M8 12V5.5a1.5 1.5 0 013 0V11m0-1V4.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V15a5 5 0 01-5 5h-2a5 5 0 01-5-5v-3a1.5 1.5 0 013 0' },
  { id: 'rect', key: 'R', label: 'Rectangle (R)', icon: 'M4 5h16v14H4z' },
  { id: 'ellipse', key: 'E', label: 'Ellipse (E)', icon: 'M12 5a7 7 0 100 14 7 7 0 000-14z' },
  { id: 'star', key: 'S', label: 'Étoile (S)', icon: 'M12 3.5l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8z' },
  { id: 'regular-polygon', key: 'P', label: 'Polygone (P)', icon: 'M12 3.5l7.5 4.4v8.2L12 20.5 4.5 16.1V7.9z' },
  { id: 'text', key: 'T', label: 'Texte (T)', icon: 'M5 6V4h14v2M12 4v16M9 20h6' },
  { id: 'zoom', key: 'Z', label: 'Zoom (Z)', icon: 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4.2-4.2' }
];

function buildToolbar() {
  const bar = $('toolbar');
  bar.textContent = '';
  for (const t of TOOLS) {
    const b = document.createElement('button');
    b.className = 'tool' + (app.tool === t.id ? ' on' : '');
    b.title = t.label;
    b.dataset.tool = t.id;
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + t.icon + '"/></svg>';
    b.addEventListener('click', () => setTool(t.id));
    bar.appendChild(b);
  }
}
function setTool(id) {
  app.tool = id;
  for (const b of $('toolbar').children) b.classList.toggle('on', b.dataset.tool === id);
  stage.style.cursor = id === 'pan' ? 'grab' : (id === 'select' ? 'default' : 'crosshair');
}

const SHAPE_TOOLS = { rect: 1, ellipse: 1, star: 1, 'regular-polygon': 1 };
const snapValue = (v) => (app.grid && app.snap ? Math.round(v / app.gridSize) * app.gridSize : v);

let drag = null;
let spaceDown = false;

function addElementToDocument(el) {
  el.parent = null;
  app.doc.children.push(el);
  return el;
}

stage.addEventListener('pointerdown', (e) => {
  stage.setPointerCapture(e.pointerId);
  const rect = stage.getBoundingClientRect();
  const screen = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  const scene = screenToScene(screen.x, screen.y);
  stopPlayback();

  if (e.button === 1 || spaceDown || app.tool === 'pan') {
    drag = { mode: 'pan', sx: screen.x, sy: screen.y, vx: app.view.x, vy: app.view.y };
    stage.style.cursor = 'grabbing';
    return;
  }
  if (app.tool === 'zoom') {
    zoomTo(app.view.zoom * (e.altKey ? 1 / 1.4 : 1.4), screen.x, screen.y);
    return;
  }
  if (app.tool === 'text') {
    pushHistory();
    const el = createElement('text', {
      position: { x: snapValue(scene.x), y: snapValue(scene.y) },
      fill: { kind: 'solid', color: parseColor('#222222') }
    });
    addElementToDocument(el);
    setTool('select');
    select([el.id]);
    refreshAll();
    setTimeout(() => { const f = document.querySelector('[data-prop-input="text"]'); if (f) { f.focus(); f.select(); } }, 30);
    return;
  }
  if (SHAPE_TOOLS[app.tool]) {
    drag = { mode: 'create', type: app.tool, start: scene, element: null };
    return;
  }

  // outil sélection
  const handle = handleAt(screen);
  if (handle) {
    const el = firstSelected();
    pushHistory();
    const b = localBounds(el, app.time);
    const center = elementCenter(el);
    let inverse = null;
    try { inverse = worldMatrix(el, app.time).inverse(); } catch (err) { inverse = new DOMMatrix(); }
    drag = {
      mode: handle === 'rot' ? 'rotate' : 'resize',
      handle: handle, element: el,
      startBox: b,
      startProps: cloneValue(el.props),
      /* Matrice et centre figés au début du glissement : les recalculer à chaque
         mouvement ferait diverger la taille, puisque l'ancrage suit la taille. */
      inverse: inverse,
      center: center,
      startAngle: Math.atan2(scene.y - center.y, scene.x - center.x) / DEG,
      startRotate: propertyValue(el, 'rotate', app.time) || 0
    };
    return;
  }

  const picked = pickElement(app.doc, scene, app.time);
  if (picked) {
    if (e.shiftKey) select([picked.id], true);
    else if (app.selection.indexOf(picked.id) === -1) select([picked.id]);
    const els = selectedElements();
    if (els.length) {
      pushHistory();
      drag = {
        mode: 'move', start: scene, moved: false,
        items: els.map(el => ({ el: el, pos: cloneValue(propertyValue(el, 'position', app.time)) }))
      };
    }
  } else {
    if (!e.shiftKey) select([]);
    drag = { mode: 'marquee', start: scene };
  }
});

function elementCenter(el) {
  const c = boxCorners(el, app.time);
  return { x: (c[0].x + c[2].x) / 2, y: (c[0].y + c[2].y) / 2 };
}

stage.addEventListener('pointermove', (e) => {
  const rect = stage.getBoundingClientRect();
  const screen = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  const scene = screenToScene(screen.x, screen.y);
  $('hud-pos').textContent = Math.round(scene.x) + ', ' + Math.round(scene.y);

  if (!drag) {
    if (app.tool === 'select') {
      const previous = hoverElement;
      hoverElement = pickElement(app.doc, scene, app.time);
      if (previous !== hoverElement) invalidate();
      const h = handleAt(screen);
      stage.style.cursor = h ? (h === 'rot' ? 'grab' : 'nwse-resize') : (hoverElement ? 'move' : 'default');
    }
    return;
  }

  if (drag.mode === 'pan') {
    app.view.x = drag.vx + (screen.x - drag.sx);
    app.view.y = drag.vy + (screen.y - drag.sy);
    invalidate();
    return;
  }

  if (drag.mode === 'create') {
    const dx = scene.x - drag.start.x, dy = scene.y - drag.start.y;
    if (!drag.element) {
      if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
      pushHistory();
      drag.element = addElementToDocument(createElement(drag.type));
      select([drag.element.id]);
    }
    const el = drag.element;
    if (drag.type === 'rect' || drag.type === 'ellipse') {
      let w = Math.abs(dx), h = Math.abs(dy);
      if (e.shiftKey) { w = h = Math.max(w, h); }
      w = Math.max(1, snapValue(w)); h = Math.max(1, snapValue(h));
      el.props.width = w;
      el.props.height = h;
      el.props.anchor = { x: w / 2, y: h / 2 };
      el.props.position = {
        x: drag.start.x + (dx < 0 ? -w / 2 : w / 2),
        y: drag.start.y + (dy < 0 ? -h / 2 : h / 2)
      };
    } else {
      const r = Math.max(2, Math.hypot(dx, dy));
      el.props.position = { x: drag.start.x, y: drag.start.y };
      el.props.anchor = { x: 0, y: 0 };
      if (drag.type === 'star') { el.props.outerRadius = r; el.props.innerRadius = r * 0.45; }
      else el.props.radius = r;
    }
    refreshPanels();
    invalidate();
    return;
  }

  if (drag.mode === 'move') {
    let dx = scene.x - drag.start.x, dy = scene.y - drag.start.y;
    if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
    for (const item of drag.items) {
      let vx = dx, vy = dy;
      if (item.el.parent) {
        try {
          const inv = worldMatrix(item.el.parent, app.time).inverse();
          const o = inv.transformPoint({ x: 0, y: 0 });
          const p = inv.transformPoint({ x: dx, y: dy });
          vx = p.x - o.x; vy = p.y - o.y;
        } catch (err) { /* matrice non inversible : on garde le delta brut */ }
      }
      setProperty(item.el, 'position', { x: snapValue(item.pos.x + vx), y: snapValue(item.pos.y + vy) });
    }
    drag.moved = true;
    refreshPanels();
    invalidate();
    return;
  }

  if (drag.mode === 'rotate') {
    const c = drag.center;
    const angle = Math.atan2(scene.y - c.y, scene.x - c.x) / DEG;
    let value = drag.startRotate + (angle - drag.startAngle);
    if (e.shiftKey) value = Math.round(value / 15) * 15;
    setProperty(drag.element, 'rotate', Math.round(value * 10) / 10);
    refreshPanels();
    invalidate();
    return;
  }

  if (drag.mode === 'resize') {
    const el = drag.element;
    const local = drag.inverse.transformPoint(scene);
    const b = drag.startBox;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const h = drag.handle;
    let dx = Math.abs(local.x - cx), dy = Math.abs(local.y - cy);
    const horizontal = /e|w/.test(h), vertical = /n|s/.test(h);
    let w = horizontal ? Math.max(1, dx * 2) : b.w;
    let hh = vertical ? Math.max(1, dy * 2) : b.h;
    if (e.shiftKey && b.w && b.h) {
      const ratio = Math.max(w / b.w, hh / b.h);
      w = b.w * ratio; hh = b.h * ratio;
    }
    if (el.type === 'rect' || el.type === 'ellipse') {
      setProperty(el, 'width', Math.round(w));
      setProperty(el, 'height', Math.round(hh));
      if (!el.animations.anchor) el.props.anchor = { x: w / 2, y: hh / 2 };
    } else if (el.type === 'star') {
      const r = Math.max(dx, dy);
      const ratio = drag.startProps.outerRadius ? r / drag.startProps.outerRadius : 1;
      setProperty(el, 'outerRadius', Math.round(r));
      setProperty(el, 'innerRadius', Math.round((drag.startProps.innerRadius || r * 0.45) * ratio));
    } else if (el.type === 'regular-polygon') {
      setProperty(el, 'radius', Math.round(Math.max(dx, dy)));
    } else if (el.type === 'text') {
      const ratio = b.h ? hh / b.h : 1;
      setProperty(el, 'fontSize', Math.max(4, Math.round((drag.startProps.fontSize || 48) * ratio)));
    } else {
      const s = drag.startProps.scale || { x: 1, y: 1 };
      setProperty(el, 'scale', {
        x: b.w ? round3(s.x * (w / b.w)) : s.x,
        y: b.h ? round3(s.y * (hh / b.h)) : s.y
      });
    }
    refreshPanels();
    invalidate();
    return;
  }

  if (drag.mode === 'marquee') {
    marquee = {
      x: Math.min(drag.start.x, scene.x), y: Math.min(drag.start.y, scene.y),
      w: Math.abs(scene.x - drag.start.x), h: Math.abs(scene.y - drag.start.y)
    };
    invalidate();
  }
});

function endDrag(e) {
  if (!drag) return;
  if (drag.mode === 'marquee' && marquee) {
    const hits = [];
    for (const el of app.doc.children) {
      if (el.hidden || el.locked) continue;
      const b = worldBounds(el, app.time);
      const overlap = !(b.x > marquee.x + marquee.w || b.x + b.w < marquee.x ||
                        b.y > marquee.y + marquee.h || b.y + b.h < marquee.y);
      if (overlap) hits.push(el.id);
    }
    select(hits, e && e.shiftKey);
    marquee = null;
  }
  if (drag.mode === 'create' && !drag.element) {
    // simple clic avec un outil de forme : on crée une forme de taille par défaut
    pushHistory();
    const el = createElement(drag.type);
    const b = localBounds(el, 0);
    el.props.position = { x: snapValue(drag.start.x), y: snapValue(drag.start.y) };
    if (drag.type === 'rect' || drag.type === 'ellipse') el.props.anchor = { x: b.w / 2, y: b.h / 2 };
    addElementToDocument(el);
    select([el.id]);
  }
  if (drag.mode === 'create' && drag.element) setTool('select');
  drag = null;
  stage.style.cursor = app.tool === 'pan' ? 'grab' : 'default';
  refreshAll();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const factor = Math.pow(0.999, e.deltaY);
  zoomTo(app.view.zoom * factor, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

stage.addEventListener('dblclick', () => {
  const el = firstSelected();
  if (el && el.type === 'text') {
    const f = document.querySelector('[data-prop-input="text"]');
    if (f) { showTab('props'); f.focus(); f.select(); }
  }
});

/* ======================= panneau des propriétés ========================= */
let propsSignature = '';

function fieldRow(label, controls, element, property) {
  const row = document.createElement('div');
  row.className = 'field';
  const l = document.createElement('label');
  l.textContent = label;
  row.appendChild(l);
  const pair = document.createElement('div');
  pair.className = 'pair';
  controls.forEach(c => pair.appendChild(c));
  row.appendChild(pair);
  if (element && property) {
    const b = document.createElement('button');
    b.className = 'kfbtn';
    b.title = 'Animer « ' + propertyLabel(property) + ' »';
    b.dataset.kfProp = property;
    b.innerHTML = '<i></i>';
    b.addEventListener('click', () => {
      pushHistory();
      toggleAnimated(element, property);
      refreshAll();
    });
    row.appendChild(b);
  } else {
    const spacer = document.createElement('span');
    spacer.style.cssText = 'flex:0 0 22px';
    row.appendChild(spacer);
  }
  return row;
}

function numberInput(element, property, opts) {
  const input = document.createElement('input');
  input.type = 'number';
  input.step = (opts && opts.step) || 1;
  if (opts && opts.min != null) input.min = opts.min;
  if (opts && opts.max != null) input.max = opts.max;
  input.dataset.propInput = property + (opts && opts.axis ? '.' + opts.axis : '');
  input.addEventListener('focus', () => { input._before = snapshot(app.doc); });
  const commit = (final) => {
    const raw = parseFloat(input.value);
    if (isNaN(raw)) return;
    const value = opts && opts.scale ? raw * opts.scale : raw;
    if (opts && opts.axis) {
      const current = cloneValue(propertyValue(element, property, app.time)) || { x: 0, y: 0 };
      current[opts.axis] = value;
      setProperty(element, property, current);
    } else {
      setProperty(element, property, value);
    }
    if (final && input._before) { app.past.push(input._before); app.future.length = 0; input._before = null; updateHistoryButtons(); }
    invalidate();
    refreshTimeline();
  };
  input.addEventListener('input', () => commit(false));
  input.addEventListener('change', () => commit(true));
  return input;
}

function colorInput(element, property) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; gap:5px; flex:1; min-width:0; align-items:center';
  const picker = document.createElement('input');
  picker.type = 'color';
  picker.dataset.propInput = property + '.color';
  const alpha = document.createElement('input');
  alpha.type = 'number';
  alpha.min = 0; alpha.max = 100; alpha.step = 1;
  alpha.title = 'Opacité de la couleur (%)';
  alpha.dataset.propInput = property + '.alpha';
  const none = document.createElement('button');
  none.textContent = '∅';
  none.title = 'Aucun';
  none.style.cssText = 'flex:0 0 26px; padding:4px 0';

  const apply = (brush, final) => {
    if (final) pushHistory();
    setProperty(element, property, brush);
    invalidate();
    refreshTimeline();
    if (final) refreshPanels();
  };
  picker.addEventListener('input', () => {
    const current = propertyValue(element, property, app.time);
    const a = current && current.kind === 'solid' ? current.color.a : 1;
    apply({ kind: 'solid', color: Object.assign(parseColor(picker.value), { a: a }) }, false);
  });
  picker.addEventListener('change', () => {
    const current = propertyValue(element, property, app.time);
    const a = current && current.kind === 'solid' ? current.color.a : 1;
    apply({ kind: 'solid', color: Object.assign(parseColor(picker.value), { a: a }) }, true);
  });
  alpha.addEventListener('change', () => {
    const current = propertyValue(element, property, app.time);
    const base = current && current.kind === 'solid' ? cloneValue(current.color) : parseColor('#888888');
    base.a = clamp(parseFloat(alpha.value) / 100, 0, 1);
    apply({ kind: 'solid', color: base }, true);
  });
  none.addEventListener('click', () => apply(null, true));
  wrap.appendChild(picker); wrap.appendChild(alpha); wrap.appendChild(none);
  return wrap;
}

function textInput(element, property) {
  const input = document.createElement('input');
  input.type = 'text';
  input.dataset.propInput = property;
  input.addEventListener('focus', () => { input._before = snapshot(app.doc); });
  input.addEventListener('input', () => { setProperty(element, property, input.value); invalidate(); });
  input.addEventListener('change', () => {
    if (input._before) { app.past.push(input._before); app.future.length = 0; input._before = null; updateHistoryButtons(); }
    refreshTimeline();
  });
  return input;
}

function selectInput(element, property, options) {
  const sel = document.createElement('select');
  sel.dataset.propInput = property;
  for (const o of options) {
    const opt = document.createElement('option');
    opt.value = o[0]; opt.textContent = o[1];
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => {
    pushHistory();
    const v = isNaN(parseFloat(sel.value)) ? sel.value : parseFloat(sel.value);
    setProperty(element, property, v);
    invalidate(); refreshTimeline();
  });
  return sel;
}

function refreshPanels() {

  const signature = els.length === 1 ? els[0].id + ':' + els[0].type
    : (els.length ? 'multi:' + els.length : 'doc:' + app.doc.id);

  if (signature !== propsSignature) {
    propsSignature = signature;
    pane.textContent = '';
    if (els.length === 1) buildElementPanel(pane, els[0]);
    else if (els.length > 1) {
      const g = groupBox('Sélection multiple');
      const info = document.createElement('div');
      info.className = 'hint';
      info.textContent = els.length + ' éléments sélectionnés. Déplacez-les sur le plan de travail, ou sélectionnez-en un seul pour modifier ses propriétés.';
      g.appendChild(info);
      pane.appendChild(g);
    } else buildDocumentPanel(pane);
  }
  syncPanelValues();
}

/* Met à jour les valeurs affichées sans reconstruire les champs. */
function syncPanelValues() {
  const el = selectedElements().length === 1 ? firstSelected() : null;
  if (!el) return;
  const s = stateAt(el, app.time);
  for (const input of $('pane-props').querySelectorAll('[data-prop-input]')) {
    if (input === document.activeElement) continue;
    const spec = input.dataset.propInput.split('.');
    const property = spec[0], part = spec[1];
    let value = s[property];
    if (value === undefined) continue;
    if (part === 'x' || part === 'y') input.value = round3(value[part]);
    else if (part === 'color') input.value = value && value.kind === 'solid' ? colorToHex(value.color) : '#000000';
    else if (part === 'alpha') input.value = Math.round((value && value.kind === 'solid' ? (value.color.a == null ? 1 : value.color.a) : 0) * 100);
    else if (part === 'rx') input.value = value ? round3(value.rx) : 0;
    else if (property === 'opacity') input.value = Math.round(value * 100);
    else input.value = typeof value === 'number' ? round3(value) : value;
  }
  for (const b of $('pane-props').querySelectorAll('[data-kf-prop]')) {
    b.classList.toggle('on', !!el.animations[b.dataset.kfProp]);
  }
}

/* ============================ arbre des calques ========================= */
function refreshLayers() {
  const box = $('layer-list');
  box.textContent = '';
  const rows = [];
  const build = (list, depth) => {
    for (let i = list.length - 1; i >= 0; i--) rows.push({ el: list[i], depth: depth });
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].children && list[i].children.length) build(list[i].children, depth + 1);
    }
  };
  build(app.doc.children, 0);

  for (const row of rows) {
    const el = row.el;
    const d = document.createElement('div');
    d.className = 'layer' + (app.selection.indexOf(el.id) !== -1 ? ' sel' : '');
    d.style.paddingLeft = (8 + row.depth * 13) + 'px';
    d.dataset.layerId = el.id;

    const eye = document.createElement('button');
    eye.textContent = el.hidden ? '○' : '●';
    eye.title = el.hidden ? 'Afficher' : 'Masquer';
    eye.addEventListener('click', (e) => { e.stopPropagation(); pushHistory(); el.hidden = !el.hidden; refreshAll(); });

    const lock = document.createElement('button');
    lock.textContent = el.locked ? '🔒' : '🔓';
    lock.title = el.locked ? 'Déverrouiller' : 'Verrouiller';
    lock.addEventListener('click', (e) => { e.stopPropagation(); pushHistory(); el.locked = !el.locked; refreshLayers(); });

    const icon = document.createElement('span');
    icon.className = 'ic';
    icon.textContent = ({ rect: '▭', ellipse: '◯', star: '★', 'regular-polygon': '⬟', text: 'T', group: '▣', poly: '⋯', path: '✎' })[el.type] || '•';

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = el.title;
    nm.title = 'Double-clic pour renommer';
    nm.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.type = 'text'; input.value = el.title;
      nm.textContent = ''; nm.appendChild(input); input.focus(); input.select();
      const done = () => { pushHistory(); el.title = input.value || el.title; refreshAll(); };
      input.addEventListener('blur', done);
      input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
    });

    const anim = document.createElement('span');

    anim.textContent = Object.keys(el.animations).length ? '◆' : '';

    const up = document.createElement('button');

    box.appendChild(empty);

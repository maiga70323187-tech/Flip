}

function reorder(el, direction) {
  const list = siblingsOf(app.doc, el);
  const i = list.indexOf(el);
  const j = i + direction;
  if (i === -1 || j < 0 || j >= list.length) return;
  pushHistory();
  list.splice(i, 1);
  list.splice(j, 0, el);
  refreshAll();
}

/* ============================ frise chronologique ======================= */
const pxPerMs = () => app.timelineZoom / 1000;
const timeToX = (ms) => ms * pxPerMs();
const xToTime = (x) => x / pxPerMs();
const frameMs = () => 1000 / (app.doc.fps || 25);
const snapToFrame = (ms) => Math.round(ms / frameMs()) * frameMs();

function keyframeKey(elementId, property, keyframeId) { return elementId + '|' + property + '|' + keyframeId; }
function isKeyframeSelected(elementId, property, keyframeId) {
  return app.selectedKeyframes.some(k => k.elementId === elementId && k.property === property && k.keyframeId === keyframeId);
}

function timelineRows() {
  const rows = [];
  for (const el of walk(app.doc.children)) {
    const properties = Object.keys(el.animations);
    const selected = app.selection.indexOf(el.id) !== -1;
    if (!properties.length && !selected) continue;
    rows.push({ kind: 'element', el: el });
    for (const property of properties) rows.push({ kind: 'property', el: el, property: property });
  }
  return rows;
}

function refreshTimeline() {
  const names = $('tl-names');
  const rowsBox = $('tl-rows');
  names.textContent = '';
  const head = document.createElement('div');
  head.className = 'head';
  names.appendChild(head);
  rowsBox.textContent = '';

  const rows = timelineRows();
  const width = Math.max(200, timeToX(app.doc.endTime) + 60);

  for (const row of rows) {
    const nameRow = document.createElement('div');
    nameRow.className = 'tl-row ' + (row.kind === 'element' ? 'el' : 'prop') +
      (row.kind === 'element' && app.selection.indexOf(row.el.id) !== -1 ? ' sel' : '');
    if (row.kind === 'element') {
      nameRow.textContent = row.el.title;
      nameRow.style.cursor = 'pointer';
      nameRow.addEventListener('pointerdown', (e) => select([row.el.id], e.shiftKey));
    } else {
      nameRow.textContent = propertyLabel(row.property);
    }
    names.appendChild(nameRow);

    const track = document.createElement('div');
    track.className = 'track' + (row.kind === 'element' ? ' el' : '');
    track.style.width = width + 'px';

    if (row.kind === 'property') {
      const animation = row.el.animations[row.property];
      const kfs = animation.keyframes;
      for (let i = 0; i < kfs.length - 1; i++) {
        const seg = document.createElement('div');
        seg.className = 'kfseg';
        seg.style.left = timeToX(kfs[i].offset) + 'px';
        seg.style.width = Math.max(0, timeToX(kfs[i + 1].offset - kfs[i].offset)) + 'px';
        track.appendChild(seg);
      }
      for (const k of kfs) {
        const d = document.createElement('div');
        d.className = 'kfd' + (isKeyframeSelected(row.el.id, row.property, k.id) ? ' sel' : '');
        d.style.left = timeToX(k.offset) + 'px';
        d.title = propertyLabel(row.property) + ' — ' + formatTime(k.offset) +
          (k.easing ? ' — ' + k.easing : '');
        d.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          startKeyframeDrag(e, row.el, row.property, k, d);
        });
        track.appendChild(d);
      }
    }
    rowsBox.appendChild(track);
  }

  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.textContent = 'Sélectionnez un élément, puis activez le losange d’une propriété pour l’animer. ' +
      'Ou activez « Enreg. » et modifiez une valeur : la clé est posée automatiquement.';
    names.appendChild(empty);
  }

  drawRuler(width);
  $('tl-rows').style.width = width + 'px';
  updatePlayhead();
}

function drawRuler(width) {
  const canvas = $('tl-ruler-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(22 * dpr);
  canvas.style.width = width + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, width, 22);
  ctx.fillStyle = css.getPropertyValue('--panel-2').trim() || '#2f2f2f';
  ctx.fillRect(0, 0, width, 22);

  const dim = css.getPropertyValue('--text-dim').trim() || '#9b9b9b';
  let stepMs = 1000;
  const candidates = [50, 100, 200, 500, 1000, 2000, 5000, 10000, 30000];
  for (const c of candidates) { if (timeToX(c) >= 60) { stepMs = c; break; } stepMs = c; }

  ctx.strokeStyle = dim;
  ctx.fillStyle = dim;
  ctx.font = '10px system-ui, sans-serif';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let t = 0; t <= app.doc.endTime + stepMs; t += stepMs) {
    const x = Math.round(timeToX(t)) + 0.5;
    ctx.moveTo(x, 13); ctx.lineTo(x, 22);
    ctx.fillText((t / 1000).toFixed(stepMs < 1000 ? 1 : 0) + 's', x + 3, 10);
  }
  ctx.stroke();

  // zone hors document
  const end = timeToX(app.doc.endTime);
  if (end < width) {
    ctx.fillStyle = 'rgba(128,128,128,.25)';
    ctx.fillRect(end, 0, width - end, 22);
  }
}

function updatePlayhead() {
  const tracks = $('tl-tracks');
  $('playhead').style.left = (timeToX(app.time) - tracks.scrollLeft) + 'px';
  $('t-time').textContent = formatTime(app.time) + ' / ' + formatTime(app.doc.endTime);
}

function setTime(ms, fromScrub) {
  app.time = clamp(fromScrub ? snapToFrame(ms) : ms, 0, app.doc.endTime);
  updatePlayhead();
  syncPanelValues();
  invalidate();
}

function scrubFromEvent(e) {
  const tracks = $('tl-tracks');
  const rect = tracks.getBoundingClientRect();
  setTime(xToTime(e.clientX - rect.left + tracks.scrollLeft), true);
}

(function bindTimelineScrub() {
  const tracks = $('tl-tracks');
  let scrubbing = false;
  tracks.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('kfd')) return;
    scrubbing = true;
    stopPlayback();
    tracks.setPointerCapture(e.pointerId);
    if (!e.shiftKey) { app.selectedKeyframes = []; refreshTimeline(); }
    scrubFromEvent(e);
  });
  tracks.addEventListener('pointermove', (e) => { if (scrubbing) scrubFromEvent(e); });
  tracks.addEventListener('pointerup', () => { scrubbing = false; });
  tracks.addEventListener('scroll', () => {
    $('tl-names').scrollTop = tracks.scrollTop;
    updatePlayhead();
  });
})();

function startKeyframeDrag(e, element, property, keyframe, node) {
  stopPlayback();
  if (e.shiftKey) {
    if (isKeyframeSelected(element.id, property, keyframe.id)) {
      app.selectedKeyframes = app.selectedKeyframes.filter(k => k.keyframeId !== keyframe.id);
    } else {
      app.selectedKeyframes.push({ elementId: element.id, property: property, keyframeId: keyframe.id });
    }
  } else if (!isKeyframeSelected(element.id, property, keyframe.id)) {
    app.selectedKeyframes = [{ elementId: element.id, property: property, keyframeId: keyframe.id }];
  }
  setTime(keyframe.offset);
  refreshTimeline();
  syncEasingSelect();

  const startX = e.clientX;
  const originals = app.selectedKeyframes.map(ref => {
    const el = findById(app.doc, ref.elementId);
    const a = el && el.animations[ref.property];
    const k = a && a.keyframes.find(x => x.id === ref.keyframeId);
    return k ? { animation: a, keyframe: k, offset: k.offset } : null;
  }).filter(Boolean);

  let historyPushed = false;
  const move = (ev) => {
    const delta = xToTime(ev.clientX - startX);
    if (!historyPushed && Math.abs(ev.clientX - startX) > 2) { pushHistory(); historyPushed = true; }
    for (const o of originals) {
      o.keyframe.offset = clamp(snapToFrame(o.offset + delta), 0, app.doc.endTime);
    }
    for (const o of originals) o.animation.sort();
    refreshTimeline();
    invalidate();
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    refreshAll();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function deleteSelectedKeyframes() {
  if (!app.selectedKeyframes.length) return false;
  pushHistory();
  for (const ref of app.selectedKeyframes) {
    const el = findById(app.doc, ref.elementId);
    const a = el && el.animations[ref.property];
    if (!a) continue;
    const k = a.keyframes.find(x => x.id === ref.keyframeId);
    if (k) a.remove(k);
    if (!a.hasKeyframes) delete el.animations[ref.property];
  }
  app.selectedKeyframes = [];
  refreshAll();
  return true;
}

function syncEasingSelect() {
  const ref = app.selectedKeyframes[0];
  if (!ref) return;
  const el = findById(app.doc, ref.elementId);
  const a = el && el.animations[ref.property];
  const k = a && a.keyframes.find(x => x.id === ref.keyframeId);
  if (k) $('t-easing').value = typeof k.easing === 'string' ? k.easing : 'linear';
}

/* ================================ lecture =============================== */
let playHandle = null;
function stopPlayback() {
  if (playHandle) cancelAnimationFrame(playHandle);
  playHandle = null;
  app.playing = false;
  $('t-play').innerHTML = '&#9654;';
}
function togglePlayback() {
  if (app.playing) { stopPlayback(); return; }
  app.playing = true;
  $('t-play').textContent = '❚❚';
  if (app.time >= app.doc.endTime) app.time = app.doc.startTime;
  let previous = performance.now();
  const step = (now) => {
    if (!app.playing) return;
    setTime(app.time + (now - previous));
    previous = now;
    if (app.time >= app.doc.endTime) {
      if (app.loop) setTime(app.doc.startTime);
      else { stopPlayback(); return; }
    }
    playHandle = requestAnimationFrame(step);
  };
  playHandle = requestAnimationFrame(step);
}

/* ============================ actions du menu =========================== */
function deleteSelection() {
  const els = selectedElements();
  if (!els.length) return;
  pushHistory();
  for (const el of els) removeElement(app.doc, el);
  app.selection = [];
  refreshAll();
}

function duplicateSelection() {
  const els = selectedElements();
  if (!els.length) return;
  pushHistory();
  const created = [];
  for (const el of els) {
    const copy = desElement(serElement(el));
    reassignIds(copy);
    copy.title = el.title + ' copie';
    copy.props.position = { x: el.props.position.x + 20, y: el.props.position.y + 20 };
    for (const property in el.animations) copy.animations[property] = el.animations[property].clone();
    const list = siblingsOf(app.doc, el);
    list.push(copy);
    copy.parent = el.parent;
    created.push(copy.id);
  }
  relink(app.doc.children, null);
  select(created);
  refreshAll();
}

function reassignIds(el) {
  el.id = uid('el');
  for (const child of el.children || []) reassignIds(child);
}

function groupSelection() {
  const els = selectedElements().filter(el => !el.parent);
  if (els.length < 1) return;
  pushHistory();
  const group = createElement('group', {}, 'Groupe');
  const firstIndex = Math.min.apply(null, els.map(el => app.doc.children.indexOf(el)));
  for (const el of els) removeElement(app.doc, el);
  group.children = els;
  relink(group.children, group);
  app.doc.children.splice(clamp(firstIndex, 0, app.doc.children.length), 0, group);
  select([group.id]);
  refreshAll();
}

function ungroupSelection() {
  const groups = selectedElements().filter(el => el.type === 'group');
  if (!groups.length) return;
  pushHistory();
  const freed = [];
  for (const g of groups) {
    const list = siblingsOf(app.doc, g);
    const index = list.indexOf(g);
    const m = localMatrix(g, app.time);
    for (const child of g.children) {
      // on reporte la transformation du groupe sur la position de l'enfant
      const p = m.transformPoint({ x: child.props.position.x, y: child.props.position.y });
      child.props.position = { x: round3(p.x), y: round3(p.y) };
      child.props.rotate = (child.props.rotate || 0) + (g.props.rotate || 0);
      child.props.scale = {
        x: round3((child.props.scale.x || 1) * (g.props.scale.x || 1)),
        y: round3((child.props.scale.y || 1) * (g.props.scale.y || 1))
      };
      child.parent = g.parent;
      freed.push(child.id);
    }
    list.splice(index, 1, ...g.children);
  }
  relink(app.doc.children, null);
  select(freed);
  refreshAll();
}

function newDocument(width, height) {
  app.doc = createDocument(width, height);
  hoverElement = null;
  app.selection = [];
  app.selectedKeyframes = [];
  app.past = []; app.future = [];
  app.time = 0;
  app.fileName = null;
  propsSignature = '';
  fitView();
  refreshAll();
}

async function saveDocument() {
  try {
    const blob = await writeEaf(app.doc);
    const name = (app.doc.title || 'animation').replace(/[^\w\-]+/g, '_') + '.eaf';
    download(blob, name);
    toast('Projet enregistré : ' + name, 'ok');
  } catch (e) {
    toast('Enregistrement impossible : ' + e.message, 'err');
  }
}

async function openDocumentFile(file) {
  try {
    const doc = await readEaf(await file.arrayBuffer());
    app.doc = doc;
    hoverElement = null;
    app.selection = [];
    app.selectedKeyframes = [];
    app.past = []; app.future = [];
    app.time = doc.startTime;
    app.fileName = file.name;
    propsSignature = '';
    fitView();
    refreshAll();
    toast('Projet ouvert : ' + file.name, 'ok');
  } catch (e) {
    toast('Ouverture impossible : ' + e.message, 'err');
  }
}

/* ================================ export ================================ */
const VIDEO_CANDIDATES = [
  { muxer: 'avc', label: 'H.264', codecs: ['avc1.640034', 'avc1.640028', 'avc1.4d0034', 'avc1.4d0028', 'avc1.42003c', 'avc1.42001f', 'avc1.4d401f'] },
  { muxer: 'vp9', label: 'VP9', codecs: ['vp09.00.10.08', 'vp09.00.31.08'] },
  { muxer: 'av1', label: 'AV1', codecs: ['av01.0.04M.08', 'av01.0.08M.08'] }
];

async function pickVideoConfig(width, height, bitrate, fps) {
  if (typeof VideoEncoder === 'undefined') return null;
  for (const candidate of VIDEO_CANDIDATES) {
    for (const codec of candidate.codecs) {
      const config = { codec: codec, width: width, height: height, bitrate: bitrate, framerate: fps };
      if (candidate.muxer === 'avc') config.avc = { format: 'avc' };
      try {
        const support = await VideoEncoder.isConfigSupported(config);
        if (support && support.supported) return { config: config, muxer: candidate.muxer, label: candidate.label };
      } catch (e) { /* codec suivant */ }
    }
  }
  return null;
}

const exportState = { running: false, cancel: false };

function exportTarget(scale) {
  const width = Math.max(2, Math.round(app.doc.width * scale / 2) * 2);
  const height = Math.max(2, Math.round(app.doc.height * scale / 2) * 2);
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d', { alpha: true });
  ctx.imageSmoothingQuality = 'high';
  return { canvas: canvas, ctx: ctx, width: width, height: height, scale: width / app.doc.width };
}

const canvasToBlob = (canvas) => new Promise((resolve, reject) =>
  canvas.toBlob(b => b ? resolve(b) : reject(new Error('encodage PNG impossible')), 'image/png'));

const exportBaseName = () => (app.doc.title || 'animation').replace(/[^\w\-]+/g, '_').slice(0, 60) || 'animation';

async function runExport(options, onProgress, onLog) {
  const target = exportTarget(options.scale);
  const background = options.background;
  const fps = options.fps;
  const from = options.from, to = options.to;
  const total = Math.max(1, Math.round((to - from) / 1000 * fps));
  const draw = (time) => renderDocument(target.ctx, app.doc, time, { scale: target.scale, background: background });

  if (options.format === 'png') {
    draw(app.time);
    const blob = await canvasToBlob(target.canvas);
    download(blob, exportBaseName() + '_' + Math.round(app.time) + 'ms.png');
    onLog('PNG exporté — ' + target.width + '×' + target.height + ', ' + Math.round(blob.size / 1024) + ' Ko');
    return;
  }

  if (options.format === 'sequence') {
    const files = [];
    const pad = String(total).length;
    for (let i = 0; i < total; i++) {
      if (exportState.cancel) throw new Error('export annulé');
      draw(from + (i * 1000) / fps);
      const blob = await canvasToBlob(target.canvas);
      files.push({ name: 'frame_' + String(i + 1).padStart(pad, '0') + '.png', data: new Uint8Array(await blob.arrayBuffer()) });
      onProgress((i + 1) / total);
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }
    const zip = zipStore(files);
    download(zip, exportBaseName() + '_' + fps + 'fps_png.zip');
    onLog(files.length + ' images PNG — ' + Math.round(zip.size / 1024) + ' Ko');
    return;
  }

  // vidéo
  const bitrate = Math.round(options.bitrate * 1000000);
  const picked = await pickVideoConfig(target.width, target.height, bitrate, fps);
  if (!picked) return await exportWebm(target, options, onProgress, onLog);
  if (picked.muxer !== 'avc') {
    onLog('H.264 indisponible ici : encodage en ' + picked.label + ' dans un conteneur MP4.');
  }

  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: picked.muxer, width: target.width, height: target.height, frameRate: fps },
    fastStart: 'in-memory'
  });
  let encoderError = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { encoderError = e; }
  });
  encoder.configure(picked.config);
  onLog('Encodage ' + target.width + '×' + target.height + ', ' + fps + ' i/s, ' + total + ' images…');

  const frameDuration = 1000000 / fps;
  for (let i = 0; i < total; i++) {
    if (exportState.cancel) { encoder.close(); throw new Error('export annulé'); }
    if (encoderError) throw encoderError;
    draw(from + (i * 1000) / fps);
    const frame = new VideoFrame(target.canvas, {
      timestamp: Math.round(i * frameDuration), duration: Math.round(frameDuration)
    });
    encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
    frame.close();
    onProgress((i + 1) / total);
    while (encoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 4));
    if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
  }
  await encoder.flush();
  encoder.close();
  if (encoderError) throw encoderError;
  muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  download(blob, exportBaseName() + '_' + fps + 'fps.mp4');
  onLog('MP4 exporté — ' + Math.round(blob.size / 1024) + ' Ko, ' + round3(total / fps) + ' s');
}

async function exportWebm(target, options, onProgress, onLog) {
  if (typeof MediaRecorder === 'undefined' || !target.canvas.captureStream) {
    throw new Error('aucun encodeur vidéo disponible — utilisez la séquence PNG');
  }
  onLog('WebCodecs indisponible : repli sur WebM.');
  const fps = options.fps;
  const total = Math.max(1, Math.round((options.to - options.from) / 1000 * fps));
  const stream = target.canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.round(options.bitrate * 1000000) });
  const parts = [];
  recorder.ondataavailable = (e) => { if (e.data.size) parts.push(e.data); };
  const stopped = new Promise(r => { recorder.onstop = r; });
  recorder.start();
  for (let i = 0; i < total; i++) {
    if (exportState.cancel) break;
    renderDocument(target.ctx, app.doc, options.from + (i * 1000) / fps, { scale: target.scale, background: options.background });
    if (track.requestFrame) track.requestFrame();
    onProgress((i + 1) / total);
    await new Promise(r => setTimeout(r, 1000 / fps));
  }
  recorder.stop();
  await stopped;
  const blob = new Blob(parts, { type: mime });
  download(blob, exportBaseName() + '_' + fps + 'fps.webm');
  onLog('WebM exporté — ' + Math.round(blob.size / 1024) + ' Ko');
}

  $('x-fps').value = app.doc.fps;
  $('x-from').value = round3(app.doc.startTime / 1000);
  $('x-to').value = round3(app.doc.endTime / 1000);

  const close = () => { if (!exportState.running) bg.remove(); else exportState.cancel = true; };
  $('x-cancel').addEventListener('click', close);
  bg.addEventListener('pointerdown', (e) => { if (e.target === bg) close(); });

  $('x-run').addEventListener('click', async () => {
    if (exportState.running) return;
    const format = $('x-format').value;
    const bgChoice = $('x-bg').value;
    const options = {
      format: format,
      fps: clamp(parseInt($('x-fps').value, 10) || 25, 1, 120),
      scale: parseFloat($('x-scale').value),
      bitrate: Math.max(1, parseFloat($('x-bitrate').value) || 8),
      from: Math.max(0, parseFloat($('x-from').value) * 1000 || 0),
      to: Math.max(0, parseFloat($('x-to').value) * 1000 || 0),
      background: bgChoice === 'doc' ? app.doc.background : bgChoice
    };
    if (options.to <= options.from && format !== 'png') {
      $('x-log').textContent = 'La fin doit être postérieure au début.';
      return;
    }
    exportState.running = true;
    exportState.cancel = false;
    $('x-run').disabled = true;
    $('x-progress').hidden = false;
    const log = (m) => { $('x-log').textContent = m; };
    try {
      await runExport(options, (p) => { $('x-progress').value = p; }, log);
    } catch (e) {
      log('Échec : ' + (e && e.message ? e.message : e));
    } finally {
      exportState.running = false;
      $('x-run').disabled = false;
      $('x-progress').hidden = true;
    }
  });
}

const kf = (offset, value, easing) => new Keyframe(cloneValue(value), offset, easing || null);

function loadDemo() {
  const doc = createDocument(1280, 720);
  doc.title = 'Exemple Expressive';
  doc.endTime = 6000;
  doc.background = '#17102e';

  const star = createElement('star', {
    position: { x: 300, y: 300 }, anchor: { x: 0, y: 0 },
    sides: 6, outerRadius: 120, innerRadius: 52,
    fill: { kind: 'solid', color: parseColor('#fc3dd7') }
  }, 'Étoile');
  star.animations.rotate = new Animation('rotate', [kf(0, 0, 'ease-in-out'), kf(6000, 360)]);
  star.animations.scale = new Animation('scale', [
    kf(0, { x: 0, y: 0 }, 'ease-out'), kf(900, { x: 1.15, y: 1.15 }, 'ease-in-out'), kf(1400, { x: 1, y: 1 })
  ]);

  const circle = createElement('ellipse', {
    width: 180, height: 180, anchor: { x: 90, y: 90 }, position: { x: 980, y: 200 },
    fill: { kind: 'solid', color: parseColor('#6e25f2') },
    strokeBrush: { kind: 'solid', color: parseColor('#ffffff') }, strokeLineWidth: 0
  }, 'Cercle');
  circle.animations.position = new Animation('position', [
    kf(400, { x: 980, y: 200 }, 'ease-in-out'), kf(2600, { x: 980, y: 520 }, 'ease-in-out'), kf(5200, { x: 980, y: 200 })
  ]);
  circle.animations.fill = new Animation('fill', [
    kf(400, { kind: 'solid', color: parseColor('#6e25f2') }, 'ease-in-out'),
    kf(2600, { kind: 'solid', color: parseColor('#ff60ce') }, 'ease-in-out'),
    kf(5200, { kind: 'solid', color: parseColor('#6e25f2') })
  ]);
  circle.animations.strokeLineWidth = new Animation('strokeLineWidth', [
    kf(400, 0, 'ease-in-out'), kf(2600, 14, 'ease-in-out'), kf(5200, 0)
  ]);

  const bar = createElement('rect', {
    width: 420, height: 14, radius: { rx: 7, ry: 7, multiple: true },
    position: { x: 430, y: 470 }, anchor: { x: 0, y: 7 },
    fill: { kind: 'solid', color: parseColor('#c93dfc') }
  }, 'Barre');
  bar.animations.scale = new Animation('scale', [kf(1200, { x: 0, y: 1 }, 'ease-out'), kf(3200, { x: 1, y: 1 })]);
  bar.animations.opacity = new Animation('opacity', [kf(1000, 0, 'ease-out'), kf(1400, 1)]);

  const title = createElement('text', {
    text: 'Expressive Studio', fontSize: 76, fontWeight: 700,
    position: { x: 430, y: 400 }, fill: { kind: 'solid', color: parseColor('#ffffff') }
  }, 'Titre');
  title.animations.opacity = new Animation('opacity', [kf(600, 0, 'ease-out'), kf(1500, 1)]);
  title.animations.position = new Animation('position', [
    kf(600, { x: 430, y: 440 }, 'ease-out'), kf(1500, { x: 430, y: 400 })
  ]);

  const subtitle = createElement('text', {
    text: 'Animer, prévisualiser, exporter', fontSize: 30, fontWeight: 400,
    position: { x: 432, y: 530 }, fill: { kind: 'solid', color: parseColor('#c9b8f5') }
  }, 'Sous-titre');
  subtitle.animations.opacity = new Animation('opacity', [kf(1600, 0, 'ease-out'), kf(2400, 1)]);

  doc.children = [star, circle, bar, title, subtitle];
  relink(doc.children, null);

  app.doc = doc;
  hoverElement = null;
  app.selection = [];
  app.selectedKeyframes = [];
  app.past = []; app.future = [];
  app.time = 0;
  propsSignature = '';
  fitView();
  refreshAll();
}

/* =============================== interface ============================== */
function showTab(which) {
  $('tab-props').classList.toggle('on', which === 'props');
  $('tab-layers').classList.toggle('on', which === 'layers');
  $('pane-props').hidden = which !== 'props';
  $('pane-layers').hidden = which === 'props';
}

function refreshAll() {
  refreshPanels();
  refreshLayers();
  refreshTimeline();
  updateHistoryButtons();
  invalidate();
}

function bindUi() {
  $('tab-props').addEventListener('click', () => showTab('props'));
  $('tab-layers').addEventListener('click', () => showTab('layers'));

  $('m-new').addEventListener('click', () => {
    if (app.doc.children.length && !confirm('Créer un nouveau document ? Les modifications non enregistrées seront perdues.')) return;
    newDocument();
  });
  $('m-open').addEventListener('click', () => $('file-input').click());
  $('file-input').addEventListener('change', (e) => {
    if (e.target.files[0]) openDocumentFile(e.target.files[0]);
    e.target.value = '';
  });
  $('m-save').addEventListener('click', saveDocument);
  $('m-undo').addEventListener('click', undo);
  $('m-redo').addEventListener('click', redo);
  $('m-group').addEventListener('click', groupSelection);
  $('m-ungroup').addEventListener('click', ungroupSelection);
  $('m-dup').addEventListener('click', duplicateSelection);
  $('m-del').addEventListener('click', deleteSelection);
  $('m-demo').addEventListener('click', loadDemo);
  $('m-export').addEventListener('click', openExportDialog);
  $('m-theme').addEventListener('click', () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    invalidate();
    refreshTimeline();
  });

  $('v-fit').addEventListener('click', fitView);
  $('v-100').addEventListener('click', () => zoomTo(1));
  $('v-grid').addEventListener('click', () => {
    app.grid = !app.grid;
    $('v-grid').classList.toggle('on', app.grid);
    invalidate();
  });

  $('t-rec').addEventListener('click', () => {
    app.recording = !app.recording;
    $('t-rec').classList.toggle('on', app.recording);
    toast(app.recording
      ? 'Enregistrement actif : toute modification pose une clé au temps courant.'
      : 'Enregistrement désactivé.');
  });
  $('t-play').addEventListener('click', togglePlayback);
  $('t-start').addEventListener('click', () => { stopPlayback(); setTime(app.doc.startTime); });
  $('t-end').addEventListener('click', () => { stopPlayback(); setTime(app.doc.endTime); });
  $('t-loop').addEventListener('click', () => {
    app.loop = !app.loop;
    $('t-loop').classList.toggle('on', app.loop);
  });
  $('t-addkf').addEventListener('click', () => {
    pushHistory();
    const n = addKeyframesAtCurrentTime();
    refreshAll();
    toast(n ? n + ' clé(s) posée(s) à ' + formatTime(app.time) : 'Aucune propriété animée : activez d’abord un losange.');
  });
  $('t-delkf').addEventListener('click', () => {
    if (!deleteSelectedKeyframes()) toast('Sélectionnez d’abord une ou plusieurs clés.');
  });
  $('t-easing').addEventListener('change', () => {
    if (!app.selectedKeyframes.length) { toast('Sélectionnez une clé pour lui appliquer une accélération.'); return; }
    pushHistory();
    const value = $('t-easing').value === 'linear' ? null : $('t-easing').value;
    for (const ref of app.selectedKeyframes) {
      const el = findById(app.doc, ref.elementId);
      const a = el && el.animations[ref.property];
      const k = a && a.keyframes.find(x => x.id === ref.keyframeId);
      if (k) k.easing = value;
    }
    refreshTimeline();
    invalidate();
  });
  $('t-zoom').addEventListener('input', () => {
    app.timelineZoom = parseInt($('t-zoom').value, 10);
    refreshTimeline();
  });

  window.addEventListener('resize', () => { resizeStage(); refreshTimeline(); });

  window.addEventListener('keydown', (e) => {
    const target = e.target;
    const typing = target && (target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.tagName === 'TEXTAREA');
    if (e.code === 'Space' && !typing) { spaceDown = true; }
    if (typing) {
      if (e.key === 'Escape') target.blur();
      return;
    }
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); saveDocument(); return; }
    if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); return; }
    if (ctrl && e.key.toLowerCase() === 'g') { e.preventDefault(); e.shiftKey ? ungroupSelection() : groupSelection(); return; }
    if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); select(app.doc.children.map(el => el.id)); return; }
    if (ctrl && e.key === '0') { e.preventDefault(); zoomTo(1); return; }
    if (e.shiftKey && e.key === '0') { e.preventDefault(); fitView(); return; }

    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      if (!deleteSelectedKeyframes()) deleteSelection();
      return;
    }
    if (e.code === 'Space') { e.preventDefault(); togglePlayback(); return; }
    if (e.key === 'Escape') { select([]); app.selectedKeyframes = []; refreshAll(); return; }

    const nudge = e.shiftKey ? 10 : 1;
    const arrows = { ArrowLeft: [-nudge, 0], ArrowRight: [nudge, 0], ArrowUp: [0, -nudge], ArrowDown: [0, nudge] };
    if (arrows[e.key]) {
      const els = selectedElements();
      if (els.length) {
        e.preventDefault();
        pushHistory();
        for (const el of els) {
          const p = cloneValue(propertyValue(el, 'position', app.time));
          setProperty(el, 'position', { x: p.x + arrows[e.key][0], y: p.y + arrows[e.key][1] });
        }
        refreshPanels(); refreshTimeline(); invalidate();
      }
      return;
    }
    if (e.key === ',' || e.key === '.') {
      e.preventDefault();
      setTime(app.time + (e.key === '.' ? frameMs() : -frameMs()), true);
      return;
    }
    const tool = TOOLS.find(t => t.key.toLowerCase() === e.key.toLowerCase());
    if (tool) setTool(tool.id);
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') spaceDown = false; });
}

/* =============================== démarrage ============================== */
function boot() {
  buildToolbar();
  bindUi();
  resizeStage();
  loadDemo();
  setTool('select');
  renderLoop();
  updateHistoryButtons();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* Points d'entrée pour les tests automatisés. */
window.ExpressiveStudio = {
  app: app,
  createElement: createElement, addElementToDocument: addElementToDocument,
  setProperty: setProperty, toggleAnimated: toggleAnimated, setTime: setTime,
  select: select, refreshAll: refreshAll, pushHistory: pushHistory, undo: undo, redo: redo,
  writeEaf: writeEaf, readEaf: readEaf, serializeDocument: serializeDocument,
  deserializeDocument: deserializeDocument, snapshot: snapshot,
  loadDemo: loadDemo, newDocument: newDocument, fitView: fitView,
  runExport: runExport, pickVideoConfig: pickVideoConfig,
  groupSelection: groupSelection, ungroupSelection: ungroupSelection,
  duplicateSelection: duplicateSelection, deleteSelection: deleteSelection,
  deleteSelectedKeyframes: deleteSelectedKeyframes,
  Animation: Animation, Keyframe: Keyframe, findById: (id) => findById(app.doc, id),
  stateAt: stateAt, localBounds: localBounds, pickElement: (p) => pickElement(app.doc, p, app.time),
  zipStore: zipStore, walk: () => Array.from(walk(app.doc.children))
};
})();
